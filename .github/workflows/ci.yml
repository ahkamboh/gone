name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The desktop app is a workspace member, and Tauri links GTK and WebKit.
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The desktop app is a workspace member, and Tauri links GTK and WebKit.
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
      # The desktop app is left out on Windows: tauri-build needs an
      # icons/icon.ico there, and no Windows build of the app ships yet.
      - run: cargo test --workspace ${{ matrix.os == 'windows-latest' && '--exclude gone-gui' || '' }}

  # Build the shippable binary the same way the release pipeline does, then
  # run it against a tiny synthetic disk image. Catches "tests pass but the
  # release binary is broken" regressions on the two unix targets.
  release-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p gone-cli
      - name: Make a tiny synthetic disk image
        run: |
          dd if=/dev/zero of=smoke.img bs=1048576 count=4
          printf 'GONE-SMOKE-MARKER' | dd of=smoke.img bs=1 seek=1 conv=notrunc
      - name: Smoke test the release binary
        run: |
          ./target/release/gone --help
          ./target/release/gone check smoke.img
