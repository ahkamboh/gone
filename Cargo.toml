[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/detect",
    "crates/gui",
    "xtask",
]
# cargo-fuzz targets have their own manifest and stay out of the workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ahkamboh/gone"
homepage = "https://github.com/ahkamboh/gone"
keywords = ["forensics", "privacy", "sanitization", "recovery", "dfir"]
categories = ["command-line-utilities"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
aes = "0.8"
ctr = "0.9"
fs2 = "0.4"
getrandom = "0.2"
ctrlc = "3"
blake3 = "1"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tempfile = "3"
prose-sanitiser-media = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1

# cargo-dist always builds with --profile dist.
[profile.dist]
inherits = "release"
